server.port=5000
spring.application.name=Vehicle_Management_System_Test

# Test H2 In-Memory Database (Runs tests reliably without external database)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Test Mail Configuration (Console fallback)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@parking.com
spring.mail.password=dummy

