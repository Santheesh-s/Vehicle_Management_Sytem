server.port=${PORT:5000}
spring.application.name=Vehicle_Management_System

# Database (Injected via Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Gmail SMTP (Injected via Environment Variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Frontend Application URL & Allowed CORS Origins (Injected dynamically via Environment Variable in Render)
# In Render dashboard, set FRONTEND_URL=https://your-project.web.app
# Supports comma-separated URLs and wildcards (*.web.app, *.firebaseapp.com)
frontend.url=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,https://*.web.app,https://*.firebaseapp.com}
cors.allowed-origins=${frontend.url}